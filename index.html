<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pada Tani - Platform Integrasi & Ekosistem Limbah Pertanian</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    @keyframes floatSlow { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    .animate-float { animation: floatSlow 3s ease-in-out infinite; }
    .glass-card { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border: 1px solid rgba(226,232,240,0.8); }
  </style>
</head>
<body class="font-sans bg-slate-50 text-slate-800 antialiased selection:bg-brand-500 selection:text-white relative">

<!-- Header -->
<header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200/80 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-20">
      <!-- Logo -->
      <a href="#" class="flex items-center gap-3 group">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-brand-700 to-brand-500 flex items-center justify-center text-white shadow-md shadow-brand-500/20 group-hover:scale-105 transition-transform duration-300">
          <i class="fa-solid fa-leaf text-xl"></i>
        </div>
        <div>
          <span class="text-2xl font-extrabold tracking-tight text-slate-900">Pada<span class="text-brand-600">Tani</span></span>
          <span class="block text-[10px] font-semibold text-slate-500 tracking-wider uppercase -mt-1">Ekosistem Limbah Agrikultur</span>
        </div>
      </a>

      <!-- Desktop Navigation Menu (SPA) -->
      <nav class="hidden md:flex items-center justify-center gap-10">
        <a href="#alur-kerja" class="nav-link text-sm font-semibold text-slate-600 hover:text-brand-600 transition-colors">Alur Kerja</a>
        <a href="#katalog" class="nav-link text-sm font-semibold text-slate-600 hover:text-brand-600 transition-colors">Katalog Limbah</a>
        <a href="#paspor-digital" class="nav-link text-sm font-semibold text-slate-600 hover:text-brand-600 transition-colors">Paspor Digital</a>
        <a href="#kalkulator" class="nav-link text-sm font-semibold text-slate-600 hover:text-brand-600 transition-colors">Kalkulator Potensi</a>
        <a href="#agri-hubs" class="nav-link text-sm font-semibold text-slate-600 hover:text-brand-600 transition-colors">Agri Hubs</a>
        <a href="#kemitraan" class="nav-link text-sm font-semibold text-slate-600 hover:text-brand-600 transition-colors">Kemitraan</a>
      </nav>

      <!-- CTA -->
      <div class="hidden md:flex items-center gap-3">
        <a href="#paspor-digital" class="px-4 py-2.5 rounded-xl text-sm font-bold text-brand-700 bg-brand-50 hover:bg-brand-100 border border-brand-200 transition-all duration-200">
          <i class="fa-solid fa-qrcode mr-2"></i>Cek Paspor
        </a>
        <a href="#kemitraan" class="px-5 py-2.5 rounded-xl text-sm font-bold text-white bg-brand-600 hover:bg-brand-700 shadow-lg shadow-brand-600/30 hover:shadow-brand-600/40 transition-all duration-200">
          Gabung Mitra
        </a>
      </div>

      <!-- Mobile Menu Toggle -->
      <button id="mobile-menu-btn" type="button" class="md:hidden p-2.5 rounded-xl text-slate-600 hover:bg-slate-100 transition-colors" aria-label="Buka Menu">
        <i class="fa-solid fa-bars text-xl"></i>
      </button>
    </div>
  </div>

  <!-- Mobile Dropdown Navigation (SPA) -->
  <div id="mobile-menu" class="hidden md:hidden border-b border-slate-200 bg-white px-4 pt-3 pb-6 space-y-3">
    <a href="#alur-kerja" class="nav-link mobile-link block px-3 py-2 rounded-lg font-semibold text-slate-700 hover:bg-slate-100">Alur Kerja</a>
    <a href="#katalog" class="nav-link mobile-link block px-3 py-2 rounded-lg font-semibold text-slate-700 hover:bg-slate-100">Katalog Limbah</a>
    <a href="#paspor-digital" class="nav-link mobile-link block px-3 py-2 rounded-lg font-semibold text-slate-700 hover:bg-slate-100">Paspor Digital</a>
    <a href="#kalkulator" class="nav-link mobile-link block px-3 py-2 rounded-lg font-semibold text-slate-700 hover:bg-slate-100">Kalkulator Potensi</a>
    <a href="#agri-hubs" class="nav-link mobile-link block px-3 py-2 rounded-lg font-semibold text-slate-700 hover:bg-slate-100">Agri Hubs</a>
    <a href="#kemitraan" class="nav-link mobile-link block px-3 py-2 rounded-lg font-semibold text-slate-700 hover:bg-slate-100">Kemitraan</a>
    <div class="pt-2 flex flex-col gap-2">
      <a href="#paspor-digital" class="nav-link mobile-link w-full text-center px-4 py-2.5 rounded-xl font-bold text-brand-700 bg-brand-50 border border-brand-200">Cek Paspor Limbah</a>
      <a href="#kemitraan" class="nav-link mobile-link w-full text-center px-4 py-2.5 rounded-xl font-bold text-white bg-brand-600">Daftar Kemitraan</a>
    </div>
  </div>
</header>

<!-- Konten Website (Hero, Alur Kerja, Katalog, dll) -->
<!-- ... seluruh section lain tetap sama seperti dokumen asli kamu ... -->

<!-- SPA Navigation Script -->
<script>
  document.querySelectorAll('.nav-link').forEach(link => {
    link.addEventListener('click', function(e) {
      e.preventDefault();
      const targetId = this.getAttribute('href').substring(1);
      const targetSection = document.getElementById(targetId);
      if (targetSection) {
        targetSection.scrollIntoView({ behavior: 'smooth' });
        history.pushState(null, '', '#' + targetId);
      }
      const mobileMenu = document.getElementById('mobile-menu');
      if (mobileMenu && !mobileMenu.classList.contains('hidden')) {
        mobileMenu.classList.add('hidden');
      }
    });
  });

  const mobileBtn = document.getElementById('mobile-menu-btn');
  if (mobileBtn) {
    mobileBtn.addEventListener('click', () => {
      const mobileMenu = document.getElementById('mobile-menu');
      if (mobileMenu) {
        mobileMenu.classList.toggle('hidden');
      }
    });
  }
</script>

</body>
</html>
